// 최종 감상 날짜 탭 전환
function switchReviewDateTab(id, tab) {
  var exact = document.getElementById('rdExact-' + id);
  var approx = document.getElementById('rdApprox-' + id);
  var btnE = document.getElementById('rdTabE-' + id);
  var btnA = document.getElementById('rdTabA-' + id);
  if (!exact) return;
  var isExact = tab === 'exact';
  exact.style.display = isExact ? '' : 'none';
  approx.style.display = isExact ? 'none' : '';
  btnE.style.borderBottomColor = isExact ? 'var(--accent)' : 'transparent';
  btnE.style.color = isExact ? 'var(--accent)' : 'var(--text-muted)';
  btnA.style.borderBottomColor = isExact ? 'transparent' : 'var(--accent)';
  btnA.style.color = isExact ? 'var(--text-muted)' : 'var(--accent)';
}

function getReviewDateValue(id) {
  var exact = document.getElementById('rdExact-' + id);
  var isApprox = exact && exact.style.display === 'none';
  if (isApprox) {
    var y = document.getElementById('rdYear-' + id)?.value;
    var m = document.getElementById('rdMonth-' + id)?.value;
    if (!y) return { date: '', dateLabel: '' };
    return {
      date: y + (m ? '-' + m.padStart(2,'0') : ''),
      dateLabel: y + (m ? '년 ' + m + '월' : '년'),
      dateType: 'approx'
    };
  }
  var date = document.getElementById('rdDate-' + id)?.value || '';
  return { date, dateLabel: date, dateType: 'exact' };
}

function buildReviewDatePicker(id, defaultDate) {
  var yearOpts = '<option value="">연도</option>';
  for (var y = new Date().getFullYear(); y >= 1950; y--) yearOpts += '<option>' + y + '</option>';
  var monthOpts = '<option value="">월 선택 안 함</option>';
  for (var m = 1; m <= 12; m++) monthOpts += '<option value="' + m + '">' + m + '월</option>';
  var s = 'width:100%;background:var(--surface);border:1px solid var(--border2);color:var(--text);padding:8px 10px;font-size:13px;outline:none;font-family:inherit';
  return '<div style="border-bottom:1px solid var(--border);display:flex;margin-bottom:8px">'
    + '<button id="rdTabE-' + id + '" type="button" data-rdid="' + id + '" data-rdtab="exact" onclick="switchReviewDateTab(this.dataset.rdid,this.dataset.rdtab)" style="padding:6px 12px;background:none;border:none;border-bottom:2px solid var(--accent);color:var(--accent);font-size:11px;cursor:pointer;font-family:inherit;margin-bottom:-1px">정확</button>'
    + '<button id="rdTabA-' + id + '" type="button" data-rdid="' + id + '" data-rdtab="approx" onclick="switchReviewDateTab(this.dataset.rdid,this.dataset.rdtab)" style="padding:6px 12px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);font-size:11px;cursor:pointer;font-family:inherit;margin-bottom:-1px">대략</button>'
    + '</div>'
    + '<div id="rdExact-' + id + '"><input type="date" id="rdDate-' + id + '" value="' + (defaultDate || '') + '" style="' + s + '"></div>'
    + '<div id="rdApprox-' + id + '" style="display:none;display:grid;grid-template-columns:1fr 1fr;gap:8px">'
    + '<select id="rdYear-' + id + '" style="' + s + '">' + yearOpts + '</select>'
    + '<select id="rdMonth-' + id + '" style="' + s + '">' + monthOpts + '</select>'
    + '</div>';
}

    + '<div class="inline-form-actions">'
    + '<button class="btn-inline-cancel" onclick="renderFinalReview(' + filmId + ')">취소</button>'
    + '<button class="btn-inline-save" onclick="saveEditReview(' + filmId + ',\'' + reviewId + '\')">저장</button>'
    + '</div></div>';
  setTimeout(function() { document.getElementById('reText-' + reviewId)?.focus(); }, 50);
}

function saveNewReview(filmId) {
  const f = films.find(x => x.id === filmId);
  if (!f) return;
  const text = document.getElementById('rText-' + filmId)?.value.trim();
  if (!text) { showToast('내용을 입력해주세요'); return; }
  const label = document.getElementById('rLabel-' + filmId)?.value.trim() || '';
  const dateInfo = getReviewDateValue('add-' + filmId);
  if (!f.reviews) f.reviews = [];
  f.reviews.push({ id: 'r' + Date.now(), label, date: dateInfo.date, dateLabel: dateInfo.dateLabel, dateType: dateInfo.dateType || 'exact', text });
  saveData();
  renderFinalReview(filmId);
  renderReviews();
  showToast('감상 저장 ✓');
}

function saveEditReview(filmId, reviewId) {
  const f = films.find(x => x.id === filmId);
  if (!f) return;
  const r = (f.reviews || []).find(x => x.id === reviewId);
  if (!r) return;
  r.label = document.getElementById('reLabel-' + reviewId)?.value.trim() || r.label;
  var dateInfo = getReviewDateValue('edit-' + reviewId);
  if (dateInfo.date) { r.date = dateInfo.date; r.dateLabel = dateInfo.dateLabel; r.dateType = dateInfo.dateType; }
  r.text = document.getElementById('reText-' + reviewId)?.value.trim() || r.text;
  saveData();
  renderFinalReview(filmId);
  renderReviews();
  showToast('수정됐어요 ✓');
}

function deleteReview(filmId, reviewId) {
  if (!confirm('이 감상을 삭제할까요?')) return;
  const f = films.find(x => x.id === filmId);
  if (!f) return;
  f.reviews = (f.reviews || []).filter(x => x.id !== reviewId);
  saveData();
  renderFinalReview(filmId);
  renderReviews();
  showToast('삭제됐어요');
}

async function deleteFilm(id) {
  if (!confirm('정말 삭제하시겠어요?')) return;
  films = films.filter(f => f.id !== id);
  const now = Date.now();
  localStorage.setItem('cinelog_films', JSON.stringify(films));
  localStorage.setItem('cinelog_updatedAt', now);
  if (window.currentUser && window.currentUser.uid && window._fbDb) {
    try {
      await window._fbDb.collection('users').doc(window.currentUser.uid).set(
        { films: films, updatedAt: now }
      );
    } catch(e) { console.warn('Firestore 삭제 실패:', e); }
  }
  closeModal('detailModal');
  renderHome();
  if (document.getElementById('page-films').classList.contains('active')) renderFilms('film');
  if (document.getElementById('page-series').classList.contains('active')) renderFilms('series');
  if (document.getElementById('page-performance').classList.contains('active')) renderFilms('performance');
  if (document.getElementById('page-reviews').classList.contains('active')) renderReviews();
  showToast('삭제되었습니다.');
}

// ── POSTER UPLOAD FUNCTIONS ──
function handlePosterUpload(input) {
  const file = input.files[0];
  if (!file) return;
  // 이미지 리사이즈 (최대 600px, 품질 0.8)
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxW = 600, maxH = 900;
      let w = img.width, h = img.height;
      if (w > maxW || h > maxH) {
        const ratio = Math.min(maxW / w, maxH / h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      currentPosterImg = dataUrl;
      setPosterPreview(dataUrl, null);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = ''; // reset so same file can be reselected
}

function setPosterPreview(imgSrc, emoji) {
  currentPosterImg = imgSrc || null;
  const emojiEl = document.getElementById('posterPreviewEmoji');
  const imgEl = document.getElementById('posterPreviewImg');
  if (!emojiEl || !imgEl) return;
  if (imgSrc) {
    imgEl.src = imgSrc;
    imgEl.style.display = 'block';
    emojiEl.style.display = 'none';
  } else {
    imgEl.style.display = 'none';
    imgEl.src = '';
    emojiEl.style.display = '';
    emojiEl.textContent = emoji || '🎬';
  }
}

function clearPosterImage() {
  currentPosterImg = null;
  const emojiVal = document.getElementById('inputEmoji').value || (currentType === 'series' ? '📺' : '🎬');
  setPosterPreview(null, emojiVal);
  showToast('포스터 사진이 제거됐어요');
}

// ── 한국 기준 현재 연도 ──
function getKoreanYear() {
  // UTC+9 기준 현재 날짜
  const now = new Date();
  const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
  return kst.getUTCFullYear();
}

function getKoreanToday() {
  const now = new Date();
  const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
  const y = kst.getUTCFullYear();
  const m = String(kst.getUTCMonth() + 1).padStart(2, '0');
  const d = String(kst.getUTCDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function applyTheme(theme) {
  const v = THEME_VARS[theme] || THEME_VARS.default;
  const root = document.documentElement;
  root.style.setProperty('--bg', v.bg);
  root.style.setProperty('--surface', v.surface);
  root.style.setProperty('--surface2', v.surface2);
  root.style.setProperty('--surface3', v.surface3);
  root.style.setProperty('--border', v.border);
  root.style.setProperty('--border2', v.border2);
  root.style.setProperty('--accent', v.accent);
  root.style.setProperty('--accent-light', v.accentLight);
  root.style.setProperty('--accent-dim', v.accentDim);
  root.style.setProperty('--gold', v.accent);
  root.style.setProperty('--gold-light', v.accentLight);
  root.style.setProperty('--gold-dim', v.accentDim);
  root.style.setProperty('--red', v.red);
  root.style.setProperty('--cream', v.cream);
  root.style.setProperty('--cream-dim', v.creamDim);
  root.style.setProperty('--cream-muted', v.creamMuted);
  root.style.setProperty('--text', v.text);
  root.style.setProperty('--text-dim', v.textDim);
  root.style.setProperty('--text-muted', v.textMuted);
  document.body.style.background = v.bg;
  document.body.style.color = v.text;
  currentTheme = theme;
  localStorage.setItem('cinelog_theme', theme);
  THEMES.forEach(t => {
    const sw = document.getElementById('swatch-' + t);
    if (sw) sw.classList.toggle('active', t === theme);
  });
}

function switchSeasonTab(filmId, season, btn) {
  const f = films.find(x => x.id === filmId);

  f.currentSeason = season;
  saveData();
  // update tab active states
  const tabs = document.getElementById('seasonTabs-' + filmId);
  if (tabs) tabs.querySelectorAll('.season-tab').forEach((t, i) => t.classList.toggle('active', i + 1 === season));

  if (detailYear) {
    detailYear.innerHTML = `${f.year || ''} ${f.genre ? '· ' + f.genre : ''} · 시리즈`;

  showToast(`시즌 ${season} 선택 ✓`);
}

                <option value="month">이번달</option>
                <option value="custom">직접 설정</option>
              </select>
            </div>
          </div>
          <div id="goalCustomDates" style="display:none" class="goal-input-row">
            <div class="form-group" style="margin:0">
              <label class="form-label">시작일</label>
              <input type="date" class="form-input" id="goalStart">
            </div>
            <div class="form-group" style="margin:0">
              <label class="form-label">종료일</label>
              <input type="date" class="form-input" id="goalEnd">
            </div>
          </div>
          <button class="btn-save" style="margin-top:4px" onclick="saveGoalForm()">목표 설정</button>
        </div>
      </div>`;

    return;
  }

  // 기간 내 관람 수 계산
  let periodWatched = watched;
  let periodLabel = '';
  const today = getKoreanToday();
  if (goal.period === 'year') {
    const y = getKoreanYear();
    periodWatched = watched.filter(f => f.date && f.date.startsWith(y + ''));
    periodLabel = y + '년';
  } else if (goal.period === 'month') {
    const ym = today.slice(0, 7);
    periodWatched = watched.filter(f => f.date && f.date.startsWith(ym));
    periodLabel = ym.replace('-', '년 ') + '월';
  } else if (goal.start && goal.end) {
    periodWatched = watched.filter(f => f.date && f.date >= goal.start && f.date <= goal.end);
    periodLabel = goal.start + ' ~ ' + goal.end;
  }

  const cnt = periodWatched.length;
  const target = goal.count;
  const pct = Math.min(Math.round(cnt / target * 100), 100);
  const done = cnt >= target;

  el.innerHTML = `
    <div class="goal-card">
      <div class="goal-header">
        <div>
          <div style="font-size:11px;color:var(--text-muted);font-family:'SF Mono','Courier New',monospace;margin-bottom:4px">${periodLabel}</div>
          <div class="goal-title">${done ? '🎉 ' : ''}목표 ${target}편${done ? ' 달성!' : ''}</div>
        </div>
        <button class="goal-edit-btn" onclick="localStorage.removeItem('mak_goal');renderStats()">재설정</button>
      </div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:12px">
        <span class="goal-num">${cnt}</span>
        <span style="color:var(--text-muted);font-size:13px">/ ${target}편</span>
        <span style="color:var(--accent);font-family:'SF Mono','Courier New',monospace;font-size:12px">${pct}%</span>
      </div>
      <div class="goal-progress-bar">
        <div class="goal-progress-fill" style="width:${pct}%"></div>
      </div>
      <div class="goal-meta">
        <span>${target - cnt > 0 ? '앞으로 ' + (target - cnt) + '편 더!' : '목표 완료 ✓'}</span>
        <span>${periodLabel}</span>
      </div>
    </div>`;
}

function saveGoalForm() {
  const count = parseInt(document.getElementById('goalCount').value);
  if (!count || count < 1) { showToast('편수를 입력해주세요'); return; }
  const period = document.getElementById('goalPeriod').value;
  const goal = { count, period };
  if (period === 'custom') {
    goal.start = document.getElementById('goalStart').value;
    goal.end = document.getElementById('goalEnd').value;
    if (!goal.start || !goal.end) { showToast('날짜를 선택해주세요'); return; }
  }
  saveGoal(goal);
  renderStats();
  showToast('목표 설정 완료 ✓');
}

// ── 감상문 카드 이미지 저장 ──
function exportCard(filmId) {
  const f = films.find(x => x.id === filmId);
  if (!f) return;

  const latestReview = (f.reviews && f.reviews.length > 0)
    ? f.reviews[f.reviews.length - 1].text
    : (f.review || '');
  const stars = '★'.repeat(f.rating || 0) + '☆'.repeat(5 - (f.rating || 0));

  // 캔버스 크기 - 세로형 매거진
  const W = 900, H = 1260;
  const PW = 380; // 포스터 너비
  const TX = PW + 50; // 텍스트 시작 X
  const TW = W - TX - 50; // 텍스트 너비

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  function drawCard(posterImg) {
    ctx.clearRect(0, 0, W, H);

    // 배경
    ctx.fillStyle = '#0d0c0a';
    ctx.fillRect(0, 0, W, H);

    // ── 좌측 포스터 ──
    if (posterImg) {
      ctx.save();
      ctx.rect(0, 0, PW, H);
      ctx.clip();
      var iw = posterImg.naturalWidth || posterImg.width;
      var ih = posterImg.naturalHeight || posterImg.height;
      var scale = Math.max(PW / iw, H / ih);
      var ox = (PW - iw * scale) / 2;
      var oy = (H - ih * scale) / 2;
      ctx.drawImage(posterImg, ox, oy, iw * scale, ih * scale);
      ctx.restore();
      // 포스터 오른쪽 페이드
      var fadeGrad = ctx.createLinearGradient(PW - 80, 0, PW + 20, 0);
      fadeGrad.addColorStop(0, 'rgba(13,12,10,0)');
      fadeGrad.addColorStop(1, 'rgba(13,12,10,1)');
      ctx.fillStyle = fadeGrad;
      ctx.fillRect(PW - 80, 0, 100, H);
    } else {
      ctx.fillStyle = '#181510';
      ctx.fillRect(0, 0, PW, H);
      ctx.font = '90px serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#3a3428';
      ctx.fillText(f.emoji || '🎬', PW / 2, H / 2 + 30);
    }

    // ── 우측 텍스트 ──
    ctx.textAlign = 'left';
    var ty = 90;

    // FILM LOG 레이블
    ctx.font = '500 13px monospace';
    ctx.fillStyle = '#c9a84c';
    ctx.fillText('FILM LOG', TX, ty);
    ty += 22;

    // 골드 라인
    ctx.fillStyle = '#c9a84c';
    ctx.fillRect(TX, ty, 44, 2);
    ty += 32;

    // 제목
    ctx.fillStyle = '#f0e8d8';
    ctx.font = 'bold 32px Georgia, serif';
    ty = cardWrap(ctx, f.title, TX, ty, TW, 42) + 20;

    // 연도
    if (f.year) {
      ctx.fillStyle = '#6e6860';
      ctx.font = '500 14px monospace';
      ctx.fillText(String(f.year), TX, ty);
      ty += 32;
    }

    // 별점
    ctx.fillStyle = '#c9a84c';
    ctx.font = '24px serif';
    ctx.fillText(stars, TX, ty);
    ty += 44;

    // 구분선
    ctx.fillStyle = '#2e2920';
    ctx.fillRect(TX, ty, TW, 1);
    ty += 28;

    // 최종 감상 라벨
    if (latestReview) {
      ctx.fillStyle = '#6e6860';
      ctx.font = 'italic 13px Georgia, serif';
      ctx.fillText('— 최종 감상', TX, ty);
      ty += 26;

      // 감상문 본문
      ctx.fillStyle = '#b8b0a0';
      ctx.font = '15px sans-serif';
      cardWrap(ctx, latestReview, TX, ty, TW, 26, 10);
    }

    // 하단 바
    ctx.fillStyle = '#161310';
    ctx.fillRect(0, H - 52, W, 52);
    ctx.fillStyle = '#c9a84c';
    ctx.font = 'bold 15px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('막이 오르다', W / 2, H - 18);

    downloadCanvas(canvas, f.title);
    showToast('카드 저장됐어요 📷');
  }

  showToast('카드 저장 중...');
  if (f.posterImg) {
    fetch(f.posterImg)
      .then(function(r) { return r.blob(); })
      .then(function(blob) {
        var url = URL.createObjectURL(blob);
        var img = new Image();
        img.onload = function() { drawCard(img); URL.revokeObjectURL(url); };
        img.onerror = function() { drawCard(null); };
        img.src = url;
      })
      .catch(function() { drawCard(null); });
  } else {
    drawCard(null);
  }
}

function cardWrap(ctx, text, x, y, maxW, lineH, maxLines) {
  if (!text) return y;
  var chars = text.split('');
  var line = '', curY = y, count = 0;
  var limit = maxLines || 99;
  for (var i = 0; i < chars.length; i++) {
    var test = line + chars[i];
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, curY);
      line = chars[i]; curY += lineH; count++;
      if (count >= limit) { ctx.fillText(line + '…', x, curY); return curY + lineH; }
    } else { line = test; }
  }
  if (line) ctx.fillText(line, x, curY);
  return curY + lineH;
}

function downloadCanvas(canvas, title) {
  const a = document.createElement('a');
  a.download = (title || 'card') + '_감상카드.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  showToast('카드 저장 완료! 📷');
}

    + '</div></div>';
  el.appendChild(formWrap);
}

function switchViewingTab(filmId, tab) {
  var exactArea = document.getElementById('vExactArea-' + filmId);
  var approxArea = document.getElementById('vApproxArea-' + filmId);
  var exactBtn = document.getElementById('vTabExact-' + filmId);
  var approxBtn = document.getElementById('vTabApprox-' + filmId);
  if (!exactArea) return;
  var isExact = tab === 'exact';
  exactArea.style.display = isExact ? '' : 'none';
  approxArea.style.display = isExact ? 'none' : '';
  exactBtn.style.borderBottomColor = isExact ? 'var(--accent)' : 'transparent';
  exactBtn.style.color = isExact ? 'var(--accent)' : 'var(--text-muted)';
  approxBtn.style.borderBottomColor = isExact ? 'transparent' : 'var(--accent)';
  approxBtn.style.color = isExact ? 'var(--text-muted)' : 'var(--accent)';
}

function toggleViewingForm(filmId) {
  var form = document.getElementById('viewingForm-' + filmId);
  if (form) form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

function saveViewing(filmId) {
  const f = films.find(x => x.id === filmId);
  if (!f) return;

  var exactArea = document.getElementById('vExactArea-' + filmId);
  var isApprox = exactArea && exactArea.style.display === 'none';

  var start, startType, startApprox;
  if (isApprox) {
    var y = document.getElementById('vApproxStartY-' + filmId)?.value;
    var m = document.getElementById('vApproxStartM-' + filmId)?.value;
    if (!y) { showToast('연도를 선택해주세요'); return; }
    startApprox = y + (m ? '년 ' + m + '월' : '년');
    start = y + (m ? '-' + m.padStart(2,'0') : '');
    startType = 'approx';
  } else {
    start = document.getElementById('vStart-' + filmId)?.value;
    if (!start) { showToast('시작일을 입력해주세요'); return; }
    startType = 'exact';
  }

  const end = (!isApprox && document.getElementById('vEnd-' + filmId)?.value) || null;
  if (!f.viewings) f.viewings = [];
  f.viewings.push({ id: 'v' + Date.now(), start, startType, startApprox: startApprox || null, end, endType: end ? 'exact' : null });
  if (f.viewings.length === 1 && start) f.date = start;
  saveData();
  renderViewingRecords(filmId);
  showToast('관람 추가 ✓');
}

function addViewingEnd(filmId, viewId) {
  const f = films.find(x => x.id === filmId);
  if (!f) return;
  const v = (f.viewings || []).find(x => x.id === viewId);
  if (!v) return;
  // 정확/대략 선택
  var choice = confirm('정확한 날짜를 알면 확인, 대략적이면 취소를 누르세요');
  if (choice) {
    var date = prompt('종료일 입력 (YYYY-MM-DD)', getKoreanToday());
    if (!date) return;
    v.end = date; v.endType = 'exact';
  } else {
    var y = prompt('종료 연도', new Date().getFullYear());
    if (!y) return;
    var m = prompt('종료 월 (모르면 엔터)', '');
    v.end = y + (m ? '-' + m.padStart(2,'0') : '');
    v.endApprox = y + (m ? '년 ' + m + '월' : '년');
    v.endType = 'approx';
  }
  saveData(); renderViewingRecords(filmId); showToast('종료일 추가 ✓');
}

function deleteViewing(filmId, viewId) {
  const f = films.find(x => x.id === filmId);
  if (!f) return;
  f.viewings = (f.viewings || []).filter(x => x.id !== viewId);
  saveData();
  renderViewingRecords(filmId);
  showToast('삭제됐어요');
}


// ── 컬렉션 ──
let collections = []; // 로그인 후 Firestore에서만 불러옴

function saveCollections() {
  localStorage.setItem('cinelog_collections', JSON.stringify(collections));
  safeSaveToFirestore({ films: films, collections: collections, updatedAt: Date.now() });
}

function switchPageTab(type, tab, btn) {
  const prefix = type === 'film' ? 'film' : type === 'series' ? 'series' : 'perf';
  document.getElementById(prefix + 'TabAll').classList.toggle('active', tab === 'all');

function renderCollectionList(type) {
  const viewId = type === 'film' ? 'filmCollectionView' : 'seriesCollectionView';

function createCollection(type) {
  const name = prompt('컬렉션 이름을 입력해주세요');

  const emoji = prompt('이모지를 입력해주세요 (선택)', '📁') || '📁';

function deleteCollection(colId, type) {

function renameCollection(colId, type) {
  const col = collections.find(function(c) { return c.id === colId; });

// ── 컬렉션 일괄 추가 ──
var _bulkColId = null;
var _bulkType = null;

function openColBulkModal(colId, type) {
  _bulkColId = colId;
  _bulkType = type;
  var col = collections.find(function(c) { return c.id === colId; });
  if (!col) return;
  document.getElementById('colBulkTitle').textContent = col.emoji + ' ' + col.name + ' — 기록 추가';
  document.getElementById('colBulkSearch').value = '';
  renderBulkList('');
  document.getElementById('colBulkModal').classList.add('open');
}

function renderBulkList(q) {
  var col = collections.find(function(c) { return c.id === _bulkColId; });
  if (!col) return;
  var typeFilms = films.filter(function(f) { return (f.type || 'film') === _bulkType; });
  var filtered = q ? typeFilms.filter(function(f) { return f.title.includes(q); }) : typeFilms;
  var list = document.getElementById('colBulkList');
  list.innerHTML = '';

  filtered.forEach(function(f) {
    var inCol = (col.filmIds || []).includes(f.id);
    var item = document.createElement('div');
    item.className = 'col-bulk-item' + (inCol ? ' checked' : '');
    item.dataset.fid = f.id;
    var posterHTML = f.posterImg
      ? '<img src="' + f.posterImg + '" alt="">'
      : (f.emoji || (_bulkType === 'series' ? '📺' : _bulkType === 'performance' ? '🎭' : '🎬'));
    var typeLabel = _bulkType === 'series' ? '시리즈' : _bulkType === 'performance' ? '공연' : '영화';
    var statusLabel = {watched:'봤어요',want:'보고싶어요',watching:'보는중'}[f.status] || '';
    item.innerHTML = '<div class="col-bulk-check">✓</div>'
      + '<div class="col-bulk-poster">' + posterHTML + '</div>'
      + '<div class="col-bulk-info">'
      + '<div class="col-bulk-title">' + f.title + '</div>'
      + '<div class="col-bulk-meta">' + (f.year || '') + (f.year ? ' · ' : '') + typeLabel + (statusLabel ? ' · ' + statusLabel : '') + '</div>'
      + '</div>';
    item.onclick = function() {
      item.classList.toggle('checked');
      updateBulkCount();
    };
    list.appendChild(item);
  });
  updateBulkCount();
}

function filterBulkList(q) {
  renderBulkList(q);
}

function updateBulkCount() {
  var n = document.querySelectorAll('.col-bulk-item.checked').length;
  document.getElementById('colBulkCount').textContent = n + '개 선택됨';
}

function saveColBulk() {
  var col = collections.find(function(c) { return c.id === _bulkColId; });
  if (!col) return;
  if (!col.filmIds) col.filmIds = [];

  var checked = document.querySelectorAll('.col-bulk-item.checked');
  var newIds = Array.from(checked).map(function(el) { return parseInt(el.dataset.fid); });

  // 현재 타입의 기존 ID는 전부 newIds로 교체
  var otherTypeIds = col.filmIds.filter(function(id) {
    var f = films.find(function(x) { return x.id === id; });
    return f && (f.type || 'film') !== _bulkType;
  });
  col.filmIds = otherTypeIds.concat(newIds);

  saveCollections();
  closeModal('colBulkModal');
  // 상세 화면 새로고침
  openCollectionDetail(_bulkColId, _bulkType);
  showToast('저장됐어요 ✓');
}

function toggleFilmInCollection(filmId, colId) {
  const col = collections.find(function(c) { return c.id === colId; });

    btn.textContent = inAny ? '📁 컬렉션 관리' : '📁 컬렉션에 추가';
    btn.className = 'add-to-collection-btn' + (inAny ? ' in-collection' : '');
  }
}


// ── 태그 자동완성 ──
var tagAutocompleteIdx = -1;

function getAllTags() {
  var tagSet = {};
  films.forEach(function(f) {
    (f.tags || []).forEach(function(t) { tagSet[t] = (tagSet[t] || 0) + 1; });
  });
  // 사용 빈도 순 정렬
  return Object.entries(tagSet).sort(function(a,b){ return b[1]-a[1]; }).map(function(x){ return x[0]; });
}

function showTagAutocomplete(val) {
  tagAutocompleteIdx = -1;
  const list = document.getElementById('tagAutocompleteList');
  if (!list) return;
  const q = val.trim();
  if (!q) { list.style.display = 'none'; return; }

  const all = getAllTags();
  const matches = all.filter(function(t) {
    return t.toLowerCase().includes(q.toLowerCase()) && !formTags.includes(t);
  }).slice(0, 8);

  if (matches.length === 0) { list.style.display = 'none'; return; }

  list.innerHTML = '';
  matches.forEach(function(t) {
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    var item = document.createElement('div');
    item.className = 'tag-autocomplete-item';
    item.dataset.tag = t;
    item.innerHTML = t.replace(re, '<span class="tag-autocomplete-highlight">$1</span>');
    item.addEventListener('mousedown', function(e) {
      e.preventDefault();
      selectTagAutocomplete(t);
    });
    list.appendChild(item);
  });
  list.style.display = 'block';
}

function selectTagAutocomplete(tag) {
  if (!formTags.includes(tag)) formTags.push(tag);
  renderFormTags();
  const input = document.getElementById('inputTagText');
  if (input) { input.value = ''; input.focus(); }
  const list = document.getElementById('tagAutocompleteList');
  if (list) list.style.display = 'none';
  tagAutocompleteIdx = -1;
}

function handleTagKeydown(e) {
  const list = document.getElementById('tagAutocompleteList');
  const items = list ? list.querySelectorAll('.tag-autocomplete-item') : [];

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    tagAutocompleteIdx = Math.min(tagAutocompleteIdx + 1, items.length - 1);
    items.forEach(function(el, i) { el.classList.toggle('active', i === tagAutocompleteIdx); });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    tagAutocompleteIdx = Math.max(tagAutocompleteIdx - 1, -1);
    items.forEach(function(el, i) { el.classList.toggle('active', i === tagAutocompleteIdx); });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (tagAutocompleteIdx >= 0 && items[tagAutocompleteIdx]) {
      selectTagAutocomplete(items[tagAutocompleteIdx].dataset.tag);
    } else {
      addFormTag();
      if (list) list.style.display = 'none';
    }
  } else if (e.key === 'Escape') {
    if (list) list.style.display = 'none';
    tagAutocompleteIdx = -1;
  }
}

// 외부 클릭 시 자동완성 닫기
document.addEventListener('click', function(e) {
  if (!e.target.closest('.tag-input-wrap')) {
    var list = document.getElementById('tagAutocompleteList');
    if (list) list.style.display = 'none';
  }
});


// Firestore 저장용 - 이미지 데이터 제거 (1MB 제한)
function stripImagesForFirestore(filmsData) {
  return filmsData.map(function(f) {
    var stripped = Object.assign({}, f);
    // base64 이미지 제거 (data:image로 시작하는 것)
    if (stripped.posterImg && stripped.posterImg.startsWith('data:')) {
      stripped.posterImg = null;
    }
    // 타래 이미지 제거
    if (stripped.thread) {
      stripped.thread = stripped.thread.map(function(t) {
        if (t.img && t.img.startsWith('data:')) {
          var tc = Object.assign({}, t);
          tc.img = null;
          return tc;
        }
        return t;
      });
    }
    return stripped;
  });
}


// ── Firebase Storage 이미지 관리 ──
async function uploadImageToStorage(filmId, dataUrl, type) {
  if (!window.currentUser || !window._fbStorage || !dataUrl) return dataUrl;
  try {
    // base64 → blob 변환
    var res = await fetch(dataUrl);
    var blob = await res.blob();
    var uid = window.currentUser.uid;
    var path = 'users/' + uid + '/' + type + '_' + filmId + '.jpg';
    var ref = window._fbStorage.ref(path);
    await ref.put(blob);
    var url = await ref.getDownloadURL();
    return url;
  } catch(e) {
    console.warn('Storage 업로드 실패:', e);
    return dataUrl; // 실패하면 base64 유지
  }
}

async function deleteImageFromStorage(filmId, type) {
  if (!window.currentUser || !window._fbStorage) return;
  try {
    var uid = window.currentUser.uid;
    var path = 'users/' + uid + '/' + type + '_' + filmId + '.jpg';
    await window._fbStorage.ref(path).delete();
  } catch(e) {}
}


// base64 이미지 → Storage 자동 마이그레이션
async function migrateImagesToStorage() {
  if (!window.currentUser || !window._fbStorage || !window._fbDb) return;
  var uid = window.currentUser.uid;
  var needsSave = false;

  for (var i = 0; i < films.length; i++) {
    var f = films[i];

    // 포스터 마이그레이션
    if (f.posterImg && f.posterImg.startsWith('data:')) {
      try {
        var res = await fetch(f.posterImg);
        var blob = await res.blob();
        var ref = window._fbStorage.ref('users/' + uid + '/poster_' + f.id + '.jpg');
        await ref.put(blob);
        var url = await ref.getDownloadURL();
        f.posterImg = url;
        needsSave = true;
        console.log('포스터 마이그레이션 완료:', f.title);
      } catch(e) { console.warn('포스터 마이그레이션 실패:', f.title, e); }
    }

    // 타래 이미지 마이그레이션
    if (f.thread) {
      for (var j = 0; j < f.thread.length; j++) {
        var t = f.thread[j];
        if (t.img && t.img.startsWith('data:')) {
          try {
            var res2 = await fetch(t.img);
            var blob2 = await res2.blob();
            var ref2 = window._fbStorage.ref('users/' + uid + '/thread_' + f.id + '_' + t.id + '.jpg');
            await ref2.put(blob2);
            var url2 = await ref2.getDownloadURL();
            t.img = url2;
            needsSave = true;
          } catch(e2) { console.warn('타래 이미지 마이그레이션 실패:', e2); }
        }
      }
    }
  }

  if (needsSave) {
    // 로컬 저장
    localStorage.setItem('cinelog_films', JSON.stringify(films));
    // Firestore 저장 (이미지 없이)
    var filmsNoImg = stripImagesForFirestore(films);
    await window._fbDb.collection('users').doc(uid).set({
      films: filmsNoImg,
      collections: collections,
      updatedAt: Date.now()
    });
    showToast('포스터 이미지 업데이트 완료 ✓');
    renderHome();
  }
}

function renderRetroHome() {

  strip.innerHTML = '';
  var recent = films.slice(-10).reverse();
  var statusLbl = {watched:'봤어요',want:'보고싶어요',watching:'보는중'};
  recent.forEach(function(f, i) {
    var frame = document.createElement('div');
    frame.className = 'film-frame';
    frame.onclick = function() { openDetail(f.id); };
    var poster = f.posterImg
      ? '<img src="' + f.posterImg + '" alt="">'
      : (f.emoji || (f.type==='series'?'📺':f.type==='performance'?'🎭':'🎬'));

    frame.innerHTML = '<div class="film-frame-img">' + poster

      + (sl ? '<div class="film-stamp">' + sl + '</div>' : '')
      + '</div>'
      + '<div class="film-frame-info">'
      + '<div class="film-frame-title">' + f.title + '</div>'
      + '<div class="film-frame-year">' + (f.year||'') + '</div>'
      + '</div>';

  });

  // 구멍 렌더
  ['retro-holes-top','retro-holes-bot'].forEach(function(id) {

    bar.innerHTML = '';
    for (var i = 0; i < 24; i++) {
      var h = document.createElement('div');
      h.className = 'film-hole-sq';
      bar.appendChild(h);

  });

  // 퍼포레이션
  var perf = document.getElementById('perf-div-1');

    for (var i = 0; i < 18; i++) {
      var h = document.createElement('div');
      h.className = 'perf-hole-sq';
      perf.appendChild(h);
    }
  }

  // 드래그 스크롤
  setupStripDrag(strip);

  // 타이핑 감상문
  var latestReview = null;
  for (var i = films.length - 1; i >= 0; i--) {
    var f = films[i];
    var rv = (f.reviews && f.reviews.length) ? f.reviews[f.reviews.length-1] : null;
    var txt = rv ? rv.text : (f.review || '');
    if (txt) { latestReview = { film: f, text: txt, date: rv ? (rv.date||'') : (f.date||''), rating: f.rating||0 }; break; }
  }
  var titleEl = document.getElementById('retro-review-title');
  var bodyEl = document.getElementById('retro-review-body');
  var starsEl = document.getElementById('retro-review-stars');
  var dateEl2 = document.getElementById('retro-review-date');
  if (!titleEl) return;
  if (latestReview) {
    titleEl.textContent = latestReview.film.title;
    starsEl.textContent = '★'.repeat(latestReview.rating) + '☆'.repeat(5-latestReview.rating);
    dateEl2.textContent = latestReview.date;
    bodyEl.innerHTML = '<span class="retro-cursor"></span>';
    var chars = latestReview.text.slice(0, 120);
    var idx = 0;
    clearInterval(window._retroTypeTimer);
    window._retroTypeTimer = setInterval(function() {
      if (idx < chars.length) {
        bodyEl.innerHTML = chars.slice(0, idx+1) + (idx < chars.length-1 ? '<span class="retro-cursor"></span>' : '');
        idx++;
      } else {
        clearInterval(window._retroTypeTimer);

    starsEl.textContent = '';
    dateEl2.textContent = '';
  }
}

function setupStripDrag(el) {
  if (!el) return;
  var isDown = false, startX, scrollLeft;
  el.addEventListener('mousedown', function(e) { isDown=true; startX=e.pageX-el.offsetLeft; scrollLeft=el.scrollLeft; });
  el.addEventListener('mouseleave', function() { isDown=false; });
  el.addEventListener('mouseup', function() { isDown=false; });
  el.addEventListener('mousemove', function(e) {
    if (!isDown) return; e.preventDefault();
    el.scrollLeft = scrollLeft - (e.pageX - el.offsetLeft - startX);
  });
}


// ── CALENDAR MONTH NAVIGATION ──
let calYear = getKoreanYear();
let calMonth = new Date().getMonth(); // 0-indexed, 현재 월

function renderCalendarMonth() {
  const calEl = document.getElementById('calendarGrid');
  if (!calEl) return;

  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const weekDays = ['일','월','화','수','목','금','토'];
  const YEAR = calYear;
  const M = calMonth;

  // 라벨 업데이트
  const monthLabel = document.getElementById('calMonthLabel');
  const yearLabel = document.getElementById('calYearLabel');
  const countLabel = document.getElementById('calMonthCount');
  if (monthLabel) monthLabel.textContent = months[M];
  if (yearLabel) yearLabel.textContent = YEAR;

  // date → films map
  const dateMap = {};
  function addToDateMap(dateStr, filmObj, label) {
    if (!dateStr) return;
    var key = dateStr.slice(0, 10); // YYYY-MM-DD만
    if (!dateMap[key]) dateMap[key] = [];
    dateMap[key].push({ film: filmObj, label: label || null });
  }

  films.filter(f => f.status !== 'want').forEach(function(f) {
    var isSeries = f.type === 'series';
    if (isSeries && f.viewings && f.viewings.length > 0) {
      // 시리즈: 각 회차의 시작/종료일로 등록
      f.viewings.forEach(function(v, idx) {
        var roundLabel = (idx + 1) + '회차';
        if (v.start) addToDateMap(v.start, f, roundLabel + ' 시작');
        if (v.end) addToDateMap(v.end, f, roundLabel + ' 완료');
      });
    } else {
      // 영화/공연: 기존 date 필드
      if (f.date) addToDateMap(f.date, f, null);
    }
  });

  // 이 달 기록 수 계산
  const monthRecords = Object.entries(dateMap).filter(([d]) => {
    const [y, m] = d.split('-').map(Number);
    return y === YEAR && m - 1 === M;
  });
  const monthCount = monthRecords.reduce((s, [, arr]) => s + arr.length, 0);
  if (countLabel) countLabel.textContent = monthCount > 0 ? monthCount + '편' : '';

  const daysInMonth = new Date(YEAR, M + 1, 0).getDate();
  const firstDow = new Date(YEAR, M, 1).getDay();

  let html = '<div class="cal-week-header">' + weekDays.map(d => `<div class="cal-week-day">${d}</div>`).join('') + '</div>';
  html += '<div class="cal-days-grid">';

  for (let i = 0; i < firstDow; i++) {
    html += '<div class="cal-day empty"></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = YEAR + '-' + String(M + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const dayEntries = dateMap[dateStr] || [];
    const firstEntry = dayEntries[0];
    const f = firstEntry ? firstEntry.film : null;

    if (dayEntries.length > 0) {
      const poster = f.posterImg
        ? '<img src="' + f.posterImg + '" alt="' + (f.title || '') + '" loading="lazy">'
        : '<div class="cal-day-emoji">' + (f.emoji || '🎬') + '</div>';
      const multi = dayEntries.length > 1 ? '<div class="cal-day-multi">+' + (dayEntries.length - 1) + '</div>' : '';
      const labelHtml = firstEntry.label ? '<div class="cal-day-label-tag">' + firstEntry.label + '</div>' : '';
      const clickFn = dayEntries.length === 1
        ? 'openDetail(' + f.id + ')'
        : 'openCalDetail(\'' + dateStr + '\', this)';
      const titleText = dayEntries.length > 1
        ? dayEntries.length + '편'
        : (firstEntry.label ? f.title : f.title);
      html += '<div class="cal-day has-record" onclick="' + clickFn + '" data-date="' + dateStr + '">'
        + poster
        + '<div class="cal-day-overlay"></div>'
        + '<div class="cal-day-num">' + d + '</div>'
        + '<div class="cal-day-title">' + titleText + '</div>'
        + (firstEntry.label && dayEntries.length === 1 ? '<div class="cal-day-viewing-label">' + firstEntry.label + '</div>' : '')
        + multi
        + '</div>';
    } else {
      html += '<div class="cal-day" onclick="openCalDetail(\'' + dateStr + '\', this)" data-date="' + dateStr + '"><div class="cal-day-num">' + d + '</div></div>';
    }
  }

  html += '</div>';
  calEl.innerHTML = html;
}


function openCalDetail(dateStr, cell) {
  var panel = document.getElementById('calDetailPanel');
  if (!panel) return;

  // 선택된 날짜 하이라이트
  document.querySelectorAll('.cal-day.selected-day').forEach(function(el) {
    el.classList.remove('selected-day');
  });
  if (cell) cell.closest('.cal-day') ? cell.closest('.cal-day').classList.add('selected-day') : null;

  // 해당 날짜 기록 찾기
  // dateMap 재구성 (openCalDetail 독립 실행용)
  var dateMapLocal = {};
  films.filter(function(f) { return f.status !== 'want'; }).forEach(function(f) {
    var isSeries = f.type === 'series';
    if (isSeries && f.viewings && f.viewings.length > 0) {
      f.viewings.forEach(function(v, idx) {
        var rl = (idx + 1) + '회차';
        function addLocal(ds, lbl) {
          if (!ds) return;
          var k = ds.slice(0, 10);
          if (!dateMapLocal[k]) dateMapLocal[k] = [];
          dateMapLocal[k].push({ film: f, label: lbl });
        }
        addLocal(v.start, rl + ' 시작');
        addLocal(v.end, rl + ' 완료');
      });
    } else {
      if (f.date) {
        var k2 = f.date.slice(0, 10);
        if (!dateMapLocal[k2]) dateMapLocal[k2] = [];
        dateMapLocal[k2].push({ film: f, label: null });
      }
    }
  });
  var dayEntries = dateMapLocal[dateStr] || [];

  // 날짜 포맷
  var parts = dateStr.split('-');
  var dateLabel = parts[0] + '년 ' + parseInt(parts[1]) + '월 ' + parseInt(parts[2]) + '일';

  panel.style.display = 'block';
  panel.innerHTML = '';

  var header = document.createElement('div');
  header.className = 'cal-detail-panel';

  var headerTitle = document.createElement('div');
  headerTitle.className = 'cal-detail-header';
  headerTitle.textContent = dateLabel;
  header.appendChild(headerTitle);

  if (dayEntries.length === 0) {
    var empty = document.createElement('div');
    empty.style.padding = '16px';
    empty.style.fontSize = '12px';
    empty.style.color = 'var(--text-muted)';
    empty.style.textAlign = 'center';
    empty.textContent = '이 날은 기록이 없어요';
    header.appendChild(empty);
  } else {
    dayEntries.forEach(function(entry) {
      var f = entry.film;
      var item = document.createElement('div');
      item.className = 'cal-detail-item';

      var posterEl = document.createElement('div');
      posterEl.className = 'cal-detail-poster';
      if (f.posterImg) {
        var img = document.createElement('img');
        img.src = f.posterImg;
        img.alt = f.title || '';
        posterEl.appendChild(img);
      } else {
        posterEl.textContent = f.emoji || '🎬';
      }

      var info = document.createElement('div');
      info.className = 'cal-detail-info';

      var title = document.createElement('div');
      title.className = 'cal-detail-title';
      title.textContent = f.title;

      var meta = document.createElement('div');
      meta.className = 'cal-detail-meta';
      var typeLabel = f.type === 'series' ? '시리즈' : f.type === 'performance' ? '공연' : '영화';
      var stars = f.rating ? '★'.repeat(f.rating) + '☆'.repeat(5 - f.rating) : '';
      var labelPart = entry.label ? entry.label : '';
      meta.textContent = typeLabel + (labelPart ? ' · ' + labelPart : '') + (stars ? ' · ' + stars : '');

      var arrow = document.createElement('div');
      arrow.className = 'cal-detail-arrow';
      arrow.textContent = '›';

      info.appendChild(title);
      info.appendChild(meta);
      item.appendChild(posterEl);
      item.appendChild(info);
      item.appendChild(arrow);

      item.onclick = (function(fid) {
        return function() { openDetail(fid); };
      })(f.id);

      header.appendChild(item);
    });
  }

  panel.appendChild(header);
  // 패널 보이도록 스크롤
  setTimeout(function() { panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 100);
}

function updateLoginUI() {
  const wrap = document.getElementById('loginBtnWrap');
  if (!wrap) return;

    const initial = (user.nickname || user.email || '?')[0].toUpperCase();

function openLoginModal() {
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginNickname').value = '';
  document.getElementById('loginError').classList.remove('show');
  switchLoginTab('login');
  document.getElementById('loginModal').classList.add('open');
}

function switchLoginTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
  document.getElementById('signupNameGroup').style.display = tab === 'signup' ? '' : 'none';
  document.getElementById('loginSubmitBtn').textContent = tab === 'login' ? '로그인' : '회원가입';
  document.getElementById('loginModalTitle').textContent = tab === 'login' ? '로그인' : '회원가입';
  document.getElementById('loginError').classList.remove('show');
}

async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const nickname = document.getElementById('loginNickname').value.trim();
  const isSignup = document.getElementById('tabSignup').classList.contains('active');
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginSubmitBtn');

  if (!email || !password) { errEl.textContent = '이메일과 비밀번호를 입력해주세요.'; errEl.classList.add('show'); return; }
  if (password.length < 6) { errEl.textContent = '비밀번호는 6자 이상이어야 해요.'; errEl.classList.add('show'); return; }

  btn.textContent = '처리중...';
  btn.disabled = true;

  try {
    const user = window.currentUser;
  const auth = window._fbAuth;
    if (isSignup) {
      const cred = await window._fbCreateUser(auth, email, password);
      const nick = nickname || email.split('@')[0];
      await window._fbUpdateProfile(cred.user, { displayName: nick });
      // Firestore에 초기 데이터 저장
      await window._fbSetDoc(window._fbDoc(window._fbDb, 'users', cred.user.uid), { films: films, updatedAt: Date.now() });
      showToast('가입 완료! 환영해요 🎬');
    } else {
      await window._fbSignIn(auth, email, password);
      showToast('로그인됐어요 🎬');
    }
    closeModal('loginModal');
  } catch(e) {
    const msgs = {
      'auth/email-already-in-use': '이미 가입된 이메일이에요.',
      'auth/user-not-found': '가입된 계정이 없어요.',
      'auth/wrong-password': '비밀번호가 틀렸어요.',
      'auth/invalid-email': '이메일 형식이 올바르지 않아요.',
      'auth/invalid-credential': '이메일 또는 비밀번호가 틀렸어요.',
      'auth/too-many-requests': '잠시 후 다시 시도해주세요.',
    };
    errEl.textContent = msgs[e.code] || '오류가 발생했어요: ' + e.message;
    errEl.classList.add('show');
  } finally {
    btn.textContent = isSignup ? '회원가입' : '로그인';
    btn.disabled = false;
  }
}

function handleGuestMode() {
  window.currentUser = null;
  closeModal('loginModal');
  showToast('게스트 모드로 이용 중이에요');
}

async function openProfileMenu() {
  if (!window.currentUser) return;
  if (confirm(window.currentUser.nickname + '님, 로그아웃 할까요?')) {
    try {
      await window._fbSignOut(window._fbAuth);
      // Firestore는 건드리지 않고 로컬만 초기화
      films = [];
      collections = [];
      localStorage.removeItem('cinelog_films');
      localStorage.removeItem('cinelog_collections');

      updateLoginUI();
      renderHome();
      showToast('로그아웃됐어요');
    } catch(e) { showToast('오류: ' + e.message); }
  }
}
